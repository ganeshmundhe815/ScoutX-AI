services:
  # ----------------------------------------------------------------------------
  # 1. Node.js + Express Backend API Gateway
  # ----------------------------------------------------------------------------
  - type: web
    name: scoutx-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --production
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: scoutx-ai-service
          property: host
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: scoutx-frontend
          property: host

  # ----------------------------------------------------------------------------
  # 2. Python AI & Computer Vision Microservice (MediaPipe & YOLOv8)
  # ----------------------------------------------------------------------------
  - type: web
    name: scoutx-ai-service
    env: python
    plan: free
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: YOLO_MODEL_PATH
        value: yolov8n.pt

  # ----------------------------------------------------------------------------
  # 3. React Native / Expo Web Frontend (Static Site with Global CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: scoutx-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_NO_TELEMETRY
        value: "1"
      - key: EXPO_PUBLIC_API_URL
        fromService:
          type: web
          name: scoutx-backend
          property: host
